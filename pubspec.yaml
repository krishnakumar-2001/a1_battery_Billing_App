name: a1_battery
description: A1 Battery Billing Pro - GST Invoice App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.13.1

  # File & Sharing
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  file_picker: ^8.0.0+1

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_slidable: ^3.1.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/image.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  assets:
    - assets/image.png
